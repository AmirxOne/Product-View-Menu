<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product View Menu — a clean product gallery with thumbnail picker and quick-view lightbox. Pure HTML/CSS/JS.">
    <meta name="theme-color" content="#f6f6f8">
    <title>Product View Menu — Image Gallery</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="page">
    <h1 class="sr-title">Product View Menu</h1>

    <section class="product-card" aria-label="Product images">
        <figure class="product-main">
            <img src="img/b47a402ed5a05189400e2d650ebefa4979a3417d_1634456870.jpg"
                 alt="Product photo, view 1" id="main-image" data-index="0">
        </figure>

        <ul class="thumb-row" role="listbox" aria-label="Choose product photo" aria-orientation="horizontal">
            <li class="thumb is-active" role="option" aria-selected="true" tabindex="0" data-index="0">
                <img src="img/b47a402ed5a05189400e2d650ebefa4979a3417d_1634456870.jpg" alt="Thumbnail, product view 1">
            </li>
            <li class="thumb" role="option" aria-selected="false" tabindex="-1" data-index="1">
                <img src="img/987bbf684de2df847c8fa1dcb9570fbf580f79dc_1611468226.jpg" alt="Thumbnail, product view 2">
            </li>
            <li class="thumb" role="option" aria-selected="false" tabindex="-1" data-index="2">
                <img src="img/9f5d8f6583a7289a096a9180ac88708856f4bd8f_1607433653.jpg" alt="Thumbnail, product view 3">
            </li>
            <li class="thumb" role="option" aria-selected="false" tabindex="-1" data-index="3">
                <img src="img/9db64cde85334e3bf4a6571547d339c57867f11f_1634390548.jpg" alt="Thumbnail, product view 4">
            </li>
        </ul>
    </section>
</main>

<div class="overlay" hidden></div>

<div class="lightbox" role="dialog" aria-modal="true" aria-label="Product photo viewer" hidden>
    <button type="button" class="lightbox-close" aria-label="Close viewer">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M3.2 2.5 2.5 3.2 7.3 8l-4.8 4.8.7.7L8 8.7l4.8 4.8.7-.7L8.7 8l4.8-4.8-.7-.7L8 7.3z" fill="currentColor"/>
        </svg>
    </button>

    <div class="lightbox-body">
        <ul class="thumb-col" role="listbox" aria-label="Choose product photo" aria-orientation="vertical">
            <li class="thumb is-active" role="option" aria-selected="true" tabindex="-1" data-index="0">
                <img src="img/b47a402ed5a05189400e2d650ebefa4979a3417d_1634456870.jpg" alt="Thumbnail, product view 1">
            </li>
            <li class="thumb" role="option" aria-selected="false" tabindex="-1" data-index="1">
                <img src="img/987bbf684de2df847c8fa1dcb9570fbf580f79dc_1611468226.jpg" alt="Thumbnail, product view 2">
            </li>
            <li class="thumb" role="option" aria-selected="false" tabindex="-1" data-index="2">
                <img src="img/9f5d8f6583a7289a096a9180ac88708856f4bd8f_1607433653.jpg" alt="Thumbnail, product view 3">
            </li>
            <li class="thumb" role="option" aria-selected="false" tabindex="-1" data-index="3">
                <img src="img/9db64cde85334e3bf4a6571547d339c57867f11f_1634390548.jpg" alt="Thumbnail, product view 4">
            </li>
        </ul>

        <figure class="lightbox-main">
            <img src="img/b47a402ed5a05189400e2d650ebefa4979a3417d_1634456870.jpg"
                 alt="Product photo, enlarged view" id="lightbox-image">
        </figure>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
